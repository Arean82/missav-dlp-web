    <!-- File List -->
    <div class="card">
        <h3><span data-i18n="downloads">Downloads</span></h3>
        <div style="display: flex; gap: 10px; align-items: center; margin-bottom: 15px;">
            <input type="text" id="fileSearch" data-i18n-placeholder="search_files" placeholder="Search files..." class="search-input" style="margin-bottom: 0;">
            <button id="deleteSelectedFilesBtn" class="btn-secondary" style="white-space: nowrap; display: none;">🗑️ <span data-i18n="delete_selected">Delete Selected</span></button>
            <button id="purgeFilesBtn" class="btn-danger" style="white-space: nowrap;">🗑️ <span data-i18n="purge_files">Delete All Files</span></button>
        </div>
        <div id="fileListHeader" style="display: none; padding: 10px; background: #1a1a2e; border-radius: 5px; margin-bottom: 10px; align-items: center;">
            <input type="checkbox" id="selectAllFiles" style="margin-right: 10px;">
            <label for="selectAllFiles" style="font-size: 14px; cursor: pointer;"><span data-i18n="select_all">Select All</span></label>
        </div>
        <div id="fileList"></div>
    </div>
