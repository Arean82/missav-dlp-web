    <!-- Folder Browser Modal -->
    <div id="browserModal" class="modal hidden" style="display: none;">
        <div class="modal-content" style="max-width: 600px; max-height: 80vh; display: flex; flex-direction: column;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
                <h3 style="margin:0;"><span data-i18n="browse_folders">Browse Folders</span></h3>
                <button id="closeBrowserBtn" class="btn-secondary" style="padding: 5px 10px;">✕</button>
            </div>
            
            <div id="browserCurrentPath" style="padding: 10px; background: #252526; border-radius: 5px; font-size: 13px; margin-bottom: 10px; word-break: break-all;"></div>
            
            <div id="browserList" style="flex-grow: 1; overflow-y: auto; border: 1px solid #333; border-radius: 5px; background: #0f0f0f;">
                <!-- Folder items will be injected here -->
            </div>
            
            <div class="button-group" style="margin-top: 15px;">
                <button id="confirmBrowserBtn" data-i18n="select_folder">Select Folder</button>
                <button id="cancelBrowserBtn" class="btn-secondary" data-i18n="cancel">Cancel</button>
            </div>
        </div>
    </div>
